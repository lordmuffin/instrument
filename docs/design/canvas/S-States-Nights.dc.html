<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nights states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="instrument.css">
<link rel="stylesheet" href="instrument-proposed.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#F6F8FA}
</style>
</helmet>
<div class="inst" data-theme="light" style="width: 2704px; min-height: 4664px; padding: 48px; display: flex; flex-direction: column; gap: 24px;">
  <div class="i-stack" style="gap: 6px;">
    <span class="t-label">Sleep Dashboard · 4 · Screens · Nights</span>
    <h1 class="t-title">Nights states</h1>
    <p class="t-caption t-2" style="max-width: 900px;">All is the screen itself. In Play, Confirm swaps its row in place and the filter switches.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, 1280px); gap: 48px; align-items: start;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <figcaption class="t-caption" style="font-weight: 600;">To review · light</figcaption>
      <div style="width: 1280px; height: 1400px; overflow: hidden; box-shadow: 0 0 0 1px var(--inst-line);"><dc-import name="S-Nights" filter="review" theme="light" hint-size="1280px,1400px"></dc-import></div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <figcaption class="t-caption" style="font-weight: 600;">To review, one row just confirmed · dark</figcaption>
      <div style="width: 1280px; height: 1400px; overflow: hidden; box-shadow: 0 0 0 1px var(--inst-line);"><dc-import name="S-Nights" filter="review" swap="confirmed" theme="dark" hint-size="1280px,1400px"></dc-import></div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <figcaption class="t-caption" style="font-weight: 600;">Confirm failed on the newest row · dark</figcaption>
      <div style="width: 1280px; height: 1400px; overflow: hidden; box-shadow: 0 0 0 1px var(--inst-line);"><dc-import name="S-Nights" swap="failed" theme="dark" hint-size="1280px,1400px"></dc-import></div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <figcaption class="t-caption" style="font-weight: 600;">LAB: confirming is off · light</figcaption>
      <div style="width: 1280px; height: 1400px; overflow: hidden; box-shadow: 0 0 0 1px var(--inst-line);"><dc-import name="S-Nights" channel="lab" theme="light" hint-size="1280px,1400px"></dc-import></div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <figcaption class="t-caption" style="font-weight: 600;">Reviews not supported · light</figcaption>
      <div style="width: 1280px; height: 1400px; overflow: hidden; box-shadow: 0 0 0 1px var(--inst-line);"><dc-import name="S-Nights" reviews="False" theme="light" hint-size="1280px,1400px"></dc-import></div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
      <figcaption class="t-caption" style="font-weight: 600;">Every night is reviewed · dark</figcaption>
      <div style="width: 1280px; height: 1400px; overflow: hidden; box-shadow: 0 0 0 1px var(--inst-line);"><dc-import name="S-Nights" empty="all-reviewed" theme="dark" hint-size="1280px,1400px"></dc-import></div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2704,"height":4664}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
